<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Goal Defender</title>
    <link rel="icon" type="image/png" href="assets/ball.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-text-size-adjust: 100%;
        }
        body {
            position: fixed;
            inset: 0;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a1a;
        }
        /* Sizing and rotation are owned by layout.js */
        #game-container canvas {
            position: absolute;
            transform-origin: 50% 50%;
            image-rendering: auto;
            touch-action: none;
        }
        #rotate-hint {
            position: fixed;
            left: 50%;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateX(-50%);
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            font-size: 14px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-out;
            z-index: 9997;
        }
        #rotate-hint.visible {
            opacity: 1;
        }
        /* Size, position and rotation are owned by layout.js so this overlay tracks
         *  the canvas exactly - including the 90 degree turn on upright phones.
         *  The values here are only the pre-script first paint. */
        #loading-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 1280px;
            height: 720px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transform-origin: 50% 50%;
            overflow: hidden;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
            /* Hidden until layout.js has sized and positioned it. Without this
               the overlay painted at its CSS default and then visibly snapped
               to the real canvas rect once the game booted. */
            visibility: hidden;
        }
        #loading-screen.placed {
            visibility: visible;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loading-screen img {
            /* Scales with the letterboxed panel rather than a fixed pixel size. */
            width: 22%;
            max-width: 150px;
            height: auto;
            aspect-ratio: 1 / 1;
            margin-bottom: 20px;
            animation: ballFloat 1.5s ease-in-out infinite, ballSpin 3s linear infinite;
        }
        @keyframes ballFloat {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-30px);
            }
        }
        @keyframes ballSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
        #loading-screen p {
            color: #ffffff;
            font-size: 24px;
            margin: 10px 0;
        }
        #loading-progress {
            color: #888888;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <img src="assets/ball.png" alt="Loading...">
        <p>Loading Game...</p>
        <p id="loading-progress">0%</p>
    </div>
    <script>
        // Safety net: the overlay starts hidden so it never paints at the wrong
        // size. If layout.js somehow fails to place it, reveal it anyway after
        // a short delay rather than leaving the player on a blank page.
        setTimeout(function () {
            var el = document.getElementById('loading-screen');
            if (el && !el.classList.contains('placed')) el.classList.add('placed');
        }, 1200);
    </script>
    <div id="game-container"></div>
    <div id="rotate-hint">Rotate your phone for a bigger view</div>
    <script src="https://unpkg.com/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="scenes/BootScene.js"></script>
    <script src="scenes/MenuScene.js"></script>
    <script src="scenes/ShopScene.js"></script>
    <script src="scenes/GameScene.js"></script>
    <script src="scenes/GameOverScene.js"></script>
    <script src="scenes/TutorialScene.js"></script>
    <script src="scenes/TournamentMenuScene.js"></script>
    <script src="scenes/TrophyRoomScene.js"></script>
    <script src="scenes/TournamentNameScene.js"></script>
    <script src="scenes/TournamentBracketScene.js"></script>
    <script src="scenes/TournamentGameScene.js"></script>
    <script src="scenes/TournamentVictoryScene.js"></script>
    <script src="scenes/SettingsScene.js"></script>
    <script src="scenes/AchievementsScene.js"></script>
    <script src="scenes/NamePromptScene.js"></script>
    <script src="scenes/LeaderboardScene.js"></script>

    <script src="settings.js"></script>
    <script src="ui.js"></script>
    <script src="achievements.js"></script>
    <script src="player.js"></script>
    <script src="layout.js"></script>
    <script src="main.js"></script>
</body>
</html>
