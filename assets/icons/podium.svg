<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Podium icon for the leaderboard button.
    Outlined to match the stroke style of the other menu icons. The crown sits
    over the tall centre block to signal first place.
  -->
  <g fill="none" stroke="#000000" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- crown, floating above the centre block -->
    <path d="M206 62 L256 108 L306 62"/>
    <path d="M196 118 L316 118"/>

    <!-- centre / 1st, tallest -->
    <rect x="176" y="240" width="160" height="168" rx="12"/>
    <!-- left / 2nd -->
    <rect x="24" y="312" width="136" height="96" rx="12"/>
    <!-- right / 3rd -->
    <rect x="352" y="276" width="136" height="132" rx="12"/>
    <!-- numeral 1 on the winning block -->
    <path d="M232 310 L256 282 L256 364"/>
  </g>
</svg>